---
- name: Wake Proxmox hosts
  hosts: 127.0.0.1
  connection: local
  gather_facts: false
  vars:
    proxmox_power_targets: []
    proxmox_boot_wait_seconds: 300
  tasks:
    - name: Ensure at least one wake target is defined
      ansible.builtin.assert:
        that:
          - proxmox_power_targets | length > 0
        fail_msg: Set proxmox_power_targets to a list of hosts with mac and host values.
      tags: [wake]

    - name: Send Wake-on-LAN packet
      community.general.wakeonlan:
        mac: "{{ item.mac }}"
        broadcast: "{{ item.broadcast | default(omit) }}"
      loop: "{{ proxmox_power_targets }}"
      loop_control:
        label: "{{ item.name | default(item.host | default(item.mac)) }}"
      tags: [wake]

    - name: Wait for SSH after wake
      ansible.builtin.wait_for:
        host: "{{ item.host }}"
        port: "{{ item.port | default(22) }}"
        timeout: "{{ item.timeout | default(proxmox_boot_wait_seconds) }}"
        sleep: 5
      loop: "{{ proxmox_power_targets }}"
      loop_control:
        label: "{{ item.name | default(item.host) }}"
      when: item.host is defined
      tags: [wake, wait]

- name: Schedule or execute graceful shutdown on Proxmox hosts
  hosts: proxmox_power_managed
  become: true
  gather_facts: false
  vars:
    proxmox_shutdown_delay_minutes: 0
  tasks:
    - name: Schedule graceful shutdown
      ansible.builtin.command:
        argv:
          - /usr/sbin/shutdown
          - -P
          - +{{ proxmox_shutdown_delay_minutes | int }}
          - Scheduled by Ansible homelab power workflow
      async: 30
      poll: 0
      changed_when: true
      tags: [shutdown]

- name: Deploy scheduled Proxmox power-off timer
  hosts: proxmox_power_managed
  become: true
  gather_facts: false
  vars:
    proxmox_poweroff_on_calendar: "*-*-* 23:30:00"
    proxmox_poweroff_randomized_delay_sec: 0
  tasks:
    - name: Install power-off service unit
      ansible.builtin.template:
        src: proxmox-power/proxmox-poweroff.service.j2
        dest: /etc/systemd/system/proxmox-poweroff.service
        owner: root
        group: root
        mode: "0644"
      tags: [timer]

    - name: Install power-off timer unit
      ansible.builtin.template:
        src: proxmox-power/proxmox-poweroff.timer.j2
        dest: /etc/systemd/system/proxmox-poweroff.timer
        owner: root
        group: root
        mode: "0644"
      tags: [timer]

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
      tags: [timer]

    - name: Enable and start power-off timer
      ansible.builtin.systemd_service:
        name: proxmox-poweroff.timer
        enabled: true
        state: started
      tags: [timer]