apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: prometheus
data:
  hosts.rules.yml: |
    groups:
    # Proxmox hosts (job proxmox-hosts) and k3s VMs (node-exporter DaemonSet)
    - name: availability
      rules:
      - alert: ProxmoxHostDown
        expr: up{job="proxmox-hosts"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Proxmox host {{ $labels.instance }} is unreachable"
          description: "node-exporter on {{ $labels.instance }} has not answered for 3 minutes. The host or its network may be down."

      - alert: K3sNodeDown
        expr: |
          (up{job="kubernetes-pods", namespace="node-exporter"} == 0)
            * on(instance) group_left(nodename) max_over_time(node_uname_info[1h])
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "k3s VM {{ $labels.nodename }} is unreachable"
          description: "node-exporter on {{ $labels.nodename }} ({{ $labels.instance }}) has not answered for 3 minutes."

      - alert: HostRebooted
        expr: |
          (changes(node_boot_time_seconds[15m]) > 0)
            * on(instance) group_left(nodename) node_uname_info
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.nodename }} rebooted"
          description: "{{ $labels.nodename }} booted within the last 15 minutes."

    - name: proxmox
      rules:
      - alert: ProxmoxNoQuorum
        expr: pve_cluster_quorate == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Proxmox cluster has no quorum (seen from {{ $labels.instance }})"
          description: "Without quorum Proxmox won't start VMs and cluster config is read-only."

      - alert: ProxmoxQuorumAtRisk
        expr: max(pve_cluster_votes{kind="total"}) - max(pve_cluster_votes{kind="quorum"}) < 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox cluster is one vote away from losing quorum"
          description: "{{ with query \"max(pve_cluster_votes{kind='total'})\" }}{{ . | first | value }}{{ end }} votes present, {{ with query \"max(pve_cluster_votes{kind='quorum'})\" }}{{ . | first | value }}{{ end }} needed. Losing one more member stops VM management."

      - alert: ProxmoxVMStopped
        expr: pve_vm_running{onboot="1"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "VM {{ $labels.name }} ({{ $labels.vmid }}) is stopped on {{ $labels.instance }}"
          description: "This VM is set to start on boot but has not been running for 5 minutes."

      # vzdump job metrics come from /usr/local/bin/pve-textfile-metrics on each host
      - alert: ProxmoxBackupFailed
        expr: pve_backup_job_last_success == 0
        labels:
          severity: warning
        annotations:
          summary: "Last vzdump backup job on {{ $labels.instance }} failed"
          description: "Check the task log in the Proxmox UI and the PBS datastore (PBS VM 105 on x1c, 192.168.1.117; data on TrueNAS/pbs)."

      - alert: ProxmoxBackupSlow
        # Snapshot-mode backups slow guest writes while they run. On 2026-10-25 a 4.5h run
        # starved Longhorn replicas on lh-* and left 14 volumes degraded.
        expr: pve_backup_job_last_duration_seconds > 2 * 3600
        labels:
          severity: warning
        annotations:
          summary: "vzdump job on {{ $labels.instance }} took {{ $value | humanizeDuration }}"
          description: "Usually a large dirty-bitmap delta from Longhorn rebuilds on lh-* or a slow PBS. Check that the job still has fleecing enabled and that Longhorn volumes are healthy."

      - alert: ProxmoxVMNotBackedUp
        # The job runs twice a day
        expr: time() - pve_vm_last_backup_timestamp_seconds > 36 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "VM {{ $labels.name }} ({{ $labels.vmid }}) has no backup from the last 36 hours"
          description: "Its newest backup on PBS is older than 36h (or it has none). Check the vzdump job and the PBS datastore."

    - name: disks
      rules:
      - alert: DiskSmartFailing
        expr: smartmon_device_smart_healthy == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SMART health check failing for {{ $labels.disk }} on {{ $labels.instance }}"
          description: "The drive reports that it is failing. Back up and replace it."

      - alert: NvmeCriticalWarning
        expr: nvme_critical_warning_total > 0
        labels:
          severity: critical
        annotations:
          summary: "NVMe critical warning on {{ $labels.device }} ({{ $labels.instance }})"
          description: "Critical warning bitmask {{ $value }}: spare, temperature, reliability or read-only problem."

      - alert: NvmeMediaErrors
        expr: increase(nvme_media_errors_total[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "New NVMe media errors on {{ $labels.device }} ({{ $labels.instance }})"
          description: "The drive recorded unrecoverable data errors in the last hour."

      - alert: NvmeWearHigh
        expr: nvme_percentage_used_ratio > 0.8
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "NVMe {{ $labels.device }} on {{ $labels.instance }} is {{ $value | humanizePercentage }} worn"
          description: "Plan a replacement before it reaches 100%."

      - alert: NvmeSpareLow
        expr: nvme_available_spare_ratio < 0.2
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "NVMe {{ $labels.device }} on {{ $labels.instance }} has {{ $value | humanizePercentage }} spare blocks left"

      - alert: NvmeTemperatureHigh
        expr: nvme_temperature_celsius > 70
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NVMe {{ $labels.device }} on {{ $labels.instance }} is at {{ $value }}°C"

      - alert: FilesystemAlmostFull
        expr: |
          ((1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|zfs", mountpoint!~"/boot.*"}
              / node_filesystem_size_bytes{fstype=~"ext4|xfs|zfs", mountpoint!~"/boot.*"}) > 0.85)
            * on(instance) group_left(nodename) node_uname_info
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.nodename }} is {{ $value | humanizePercentage }} full"

      - alert: FilesystemFull
        expr: |
          ((1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|zfs", mountpoint!~"/boot.*"}
              / node_filesystem_size_bytes{fstype=~"ext4|xfs|zfs", mountpoint!~"/boot.*"}) > 0.95)
            * on(instance) group_left(nodename) node_uname_info
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.nodename }} is {{ $value | humanizePercentage }} full"

    - name: resources
      rules:
      - alert: CpuTemperatureHigh
        # k10temp (AMD CPU package) sensor on the UM773 hosts
        expr: node_hwmon_temp_celsius{job="proxmox-hosts", chip="pci0000:00_0000:00:18_3"} > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU on {{ $labels.instance }} is at {{ $value }}°C"
          description: "Check fans and airflow; the CPU may be throttling."

      - alert: MemoryLow
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1)
            * on(instance) group_left(nodename) node_uname_info
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.nodename }} has {{ $value | humanizePercentage }} memory available"

    - name: monitoring
      rules:
      - alert: HostMetricsStale
        # SMART/NVMe collectors run every 15 min, the Proxmox script every minute
        expr: time() - node_textfile_mtime_seconds{job="proxmox-hosts"} > 3600
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.file }} on {{ $labels.instance }} hasn't updated in over an hour"
          description: "A host health collector stopped running, so disk or quorum problems may go unreported."

      - alert: Watchdog
        # Always firing. Alertmanager sends it to the "heartbeat" receiver; point that at an
        # external dead man's switch (e.g. healthchecks.io) to find out when alerting itself dies.
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alerting pipeline heartbeat"

      - alert: PrometheusRuleFailures
        expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Prometheus rule group {{ $labels.rule_group }} is failing to evaluate"
          description: "Alerts in this group can't fire. Check the Prometheus logs for the failing expression."

      - alert: PrometheusNotificationsFailing
        expr: |
          increase(prometheus_notifications_errors_total[15m]) > 0
            or prometheus_notifications_alertmanagers_discovered < 1
        labels:
          severity: warning
        annotations:
          summary: "Prometheus can't deliver alerts to Alertmanager"
          description: "Firing alerts are not reaching Alertmanager, so none of them will notify."

      - alert: AlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager failed to send {{ $labels.integration }} notifications"
          description: "Pushover rejected or didn't answer. This alert may not reach you either; check http://192.168.2.133:9090/alerts."

    - name: certificates
      rules:
      - alert: CertificateExpiringSoon
        # cert-manager renews 30 days out, so under 14 days means renewal is failing
        expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
        labels:
          severity: warning
        annotations:
          summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}"
          description: "cert-manager hasn't renewed it. Check the Certificate and its CertificateRequest/Order for errors."

      - alert: CertificateNotReady
        expr: max by (exported_namespace, name) (certmanager_certificate_ready_status{condition="False"}) == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready"
          description: "kubectl -n {{ $labels.exported_namespace }} describe certificate {{ $labels.name }} shows why."

    # Longhorn via longhorn-manager metrics (job longhorn).
    # robustness: 1 healthy, 2 degraded, 3 faulted. backup_state: 3 completed, 4 error.
    - name: storage
      rules:
      - alert: LonghornVolumeFaulted
        expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness) == 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is faulted"
          description: "No healthy replica is available; the app using {{ $labels.volume }} is down or read-only."

      - alert: LonghornVolumeDegraded
        expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness) == 2
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has been degraded for an hour"
          description: "It is running on fewer replicas than configured and isn't rebuilding. Check the volume in the Longhorn UI."

      - alert: LonghornVolumeDegradedLong
        expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness) == 2
        for: 12h
        labels:
          severity: critical
        annotations:
          summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has been degraded for 12 hours"
          description: "Rebuilds are stuck, so one more failure loses the volume. Look for replicas with rebuildRetryCount 5 that aren't in the engine's replicaModeMap: they hold the per-node rebuild slot. 'failed to start rebuild ... context deadline exceeded' in a worker's longhorn-manager log means that worker's instance-manager needs restarting."

      - alert: LonghornBackupFailed
        expr: max by (volume, backup) (longhorn_backup_state) == 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Longhorn backup {{ $labels.backup }} failed"
          description: "Backup of {{ $labels.volume }} is in Error state. Check the backup target (TrueNAS NFS) in the Longhorn UI."

      - alert: LonghornVolumeNotBackedUp
        # Volumes with no completed backup that is newer than 36h (nightly job runs at 03:00)
        expr: |
          max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness)
            unless on (volume)
          (max by (volume, backup) (longhorn_backup_state == 3)
            unless on (backup) max by (backup) (longhorn_backup_state offset 36h))
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.pvc_namespace }}/{{ $labels.pvc }} has no Longhorn backup from the last 36 hours"
          description: "The nightly-backup recurring job didn't produce a backup for {{ $labels.volume }}. Check the job and the backup target."

    # Kubernetes object state via kube-state-metrics (job kube-state-metrics); PVC usage via kubelet
    - name: kubernetes
      rules:
      - alert: KubeStateMetricsDown
        expr: absent(up{job="kube-state-metrics"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "kube-state-metrics isn't being scraped"
          description: "Pod, Deployment, Job and CronJob alerts can't fire until it's back."

      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready", status="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes node {{ $labels.node }} is not Ready"
          description: "Pods on it are being evicted or can't start. Check the VM and k3s on it."

      - alert: KubePodCrashLooping
        expr: max by (namespace, pod, container) (max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m])) >= 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash looping"
          description: "kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} --previous shows the last crash."

      - alert: KubePodStuckPending
        # Covers pods stuck in Init too: they stay in phase Pending
        expr: max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"}) == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} has been Pending or Unknown for 30 minutes"
          description: "It can't be scheduled, its volume can't attach, or an init container is stuck. kubectl describe pod shows which."

      - alert: KubeDeploymentUnavailable
        expr: kube_deployment_spec_replicas > kube_deployment_status_replicas_available
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has had unavailable replicas for 30 minutes"

      - alert: KubeStatefulSetUnavailable
        expr: kube_statefulset_replicas > kube_statefulset_status_replicas_ready
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has had unready replicas for 30 minutes"

      - alert: KubeDaemonSetUnavailable
        expr: kube_daemonset_status_number_unavailable > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} is missing {{ $value }} pods"

      - alert: KubeJobFailed
        expr: kube_job_status_failed > 0
        labels:
          severity: warning
        annotations:
          summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
          description: "Check its pod logs, then delete the Job to clear this alert."

      - alert: KubeCronJobNotSucceeding
        # 8 days so weekly CronJobs don't fire between runs; suspended CronJobs are skipped
        expr: |
          time() - kube_cronjob_status_last_successful_time > 8 * 86400
            unless on (namespace, cronjob) kube_cronjob_spec_suspend == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} hasn't succeeded in {{ $value | humanizeDuration }}"

      - alert: PersistentVolumeFillingUp
        expr: |
          kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
            and kubelet_volume_stats_used_bytes > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} free"
          description: "Apps on a full volume crash or corrupt their data (Prometheus did on 2026-10-18). Expand the PVC or clean it up."

    # TCP probes via blackbox-exporter (job blackbox-tcp)
    - name: reachability
      rules:
      - alert: TrueNASNfsUnreachable
        expr: probe_success{target_name="truenas-nfs"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "TrueNAS NFS ({{ $labels.instance }}) is not answering"
          description: "Every media app, SABnzbd's downloads and Longhorn's backup target use this NFS server. Expect app and backup alerts to follow."

      - alert: PbsUnreachable
        expr: probe_success{target_name="pbs"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox Backup Server ({{ $labels.instance }}) is not answering"
          description: "VM backups will fail until it's back. It runs as VM 105 on x1c and stores backups on TrueNAS over NFS."

      - alert: BlackboxProbesMissing
        expr: absent(up{job="blackbox-tcp"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "blackbox-exporter probes aren't running"
          description: "TrueNAS and PBS reachability is unmonitored. Check the blackbox-exporter pod."

    # Radarr/Sonarr/SABnzbd via exportarr (namespace exportarr). Decluttarr clears
    # routine failures, so anything these catch usually needs a human.
    - name: media
      rules:
      - alert: MediaExporterDown
        expr: up{namespace="exportarr"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "exportarr pod {{ $labels.pod }} is not being scraped"
          description: "Radarr/Sonarr/SABnzbd monitoring is blind until it comes back."

      - alert: MediaAppUnreachable
        # The exporter's successful-scrape counter stops growing when its app stops answering
        expr: increase({__name__=~"(radarr|sonarr|sabnzbd)_scrape_requests_total", code="200"}[15m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.url }} has not answered for 15+ minutes"
          description: "The app is down or its API is hanging. A stuck SABnzbd API also makes Radarr/Sonarr lose track of downloads."

      - alert: ArrQueueStuck
        expr: sum by (url) ({__name__=~"radarr_queue_total|sonarr_queue_total", download_status="warning"}) > 5
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} items stuck in the queue at {{ $labels.url }}"
          description: "Decluttarr only clears redundant or failed items, so these likely need a manual import or mapping."

      - alert: SabnzbdUnreachableFromArr
        # Radarr/Sonarr mark a grab "downloadClientUnavailable" whenever they can't hand it to
        # SABnzbd. Either SABnzbd's API timed out (it often still queues the NZB, leaving an
        # untracked duplicate) or the indexer refused the NZB download (abNZB serves each NZB
        # once per 8 hours, so retries of a pending grab get 403s).
        expr: sum by (url) ({__name__=~"radarr_queue_total|sonarr_queue_total", status="downloadClientUnavailable"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.url }} has {{ $value }} grabs it can't hand to SABnzbd"
          description: "Check the app's log. 'Downloading nzb ... failed' with 403 means the indexer: remove the pending item with blocklist. A timeout means SABnzbd's API is busy with repair/unpack over NFS; if that keeps happening, move intermediate/ to local scratch disks on the workers (planned 2026-10-23)."

      - alert: SabnzbdApiSlow
        # 3+ minutes in the last hour where SABnzbd's queue API took over 5 seconds
        expr: count_over_time((max(max_over_time(sabnzbd_queue_query_duration_seconds[1m])) > 5)[1h:1m]) >= 3
        labels:
          severity: warning
        annotations:
          summary: "SABnzbd's API was slow ({{ $value }} minutes over 5s in the last hour)"
          description: "Radarr/Sonarr calls to SABnzbd are likely timing out. Baseline on 2026-10-23 was 0.1s average with rare spikes."

      - alert: SabnzbdDiskFilling
        expr: max by (folder) (sabnzbd_disk_used_bytes / sabnzbd_disk_total_bytes) > 0.85
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "SABnzbd {{ $labels.folder }} disk is {{ $value | humanizePercentage }} full"
          description: "SABnzbd pauses when the download share fills. Clear completed/ or check for imports that aren't moving files out."

      - alert: UsenetPrimaryMissingArticles
        # SABnzbd's articles_success counter actually counts articles the server did NOT have
        # (checked against downloaded bytes on 2026-10-23). NewsDemon normally misses 15-80% in
        # an hour because of takedowns; missing nearly everything means the account or server is broken.
        expr: |
          increase(sabnzbd_server_articles_success{server="news.newsdemon.com"}[1h])
            / increase(sabnzbd_server_articles_total{server="news.newsdemon.com"}[1h]) > 0.9
          and increase(sabnzbd_server_articles_total{server="news.newsdemon.com"}[1h]) > 5000
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "NewsDemon is missing {{ $value | humanizePercentage }} of articles"
          description: "Almost every download will fail as 'Aborted, cannot be completed'. Test the server in SABnzbd (Config > Servers) and check the NewsDemon account."
