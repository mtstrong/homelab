apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
    - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
      - static_configs:
        - targets: ['alertmanager.prometheus.svc.cluster.local:9093']

    scrape_configs:
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']

    # Discover K8s services/endpoints annotated with prometheus.io/scrape: 'true'
    - job_name: 'kubernetes-service-endpoints'
      kubernetes_sd_configs:
      - role: endpoints
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: 'true'
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
        action: replace
        target_label: __scheme__
        regex: (https?)
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: (.+?)(?::\d+)?;(\d+)
        replacement: $1:$2
      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: service

    # Discover annotated pods
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: 'true'
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __address__]
        action: replace
        target_label: __address__
        regex: (\d+);(.+?):\d+
        replacement: $2:$1
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

    # Proxmox hosts: node-exporter plus SMART/NVMe and Proxmox quorum textfile metrics
    - job_name: 'proxmox-hosts'
      static_configs:
      - targets: ['192.168.1.109:9100']
        labels:
          instance: um773a
      - targets: ['192.168.1.62:9100']
        labels:
          instance: x1b
      - targets: ['192.168.1.25:9100']
        labels:
          instance: x1c
      - targets: ['192.168.1.87:9100']
        labels:
          instance: x1a

    # Longhorn: each longhorn-manager pod reports volume, node and backup metrics for its node
    - job_name: 'longhorn'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [longhorn-system]
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: longhorn-manager
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: '9500'
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

    # Kubernetes object state. honor_labels keeps the namespace/pod labels kube-state-metrics
    # reports instead of overwriting them with its own pod's.
    - job_name: 'kube-state-metrics'
      honor_labels: true
      static_configs:
      - targets: ['kube-state-metrics.kube-state-metrics.svc.cluster.local:8080']

    # TCP reachability of hosts outside the cluster, probed through blackbox-exporter
    - job_name: 'blackbox-tcp'
      metrics_path: /probe
      params:
        module: [tcp_connect]
      static_configs:
      - targets: ['192.168.1.70:2049']
        labels:
          target_name: truenas-nfs
      - targets: ['192.168.1.117:8007']
        labels:
          target_name: pbs
      relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115

    # Optional: scrape Loki metrics if present
    - job_name: 'loki'
      static_configs:
      - targets: ['loki.loki-stack.svc.cluster.local:3100']
        labels:
          service: loki
