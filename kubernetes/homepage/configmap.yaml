apiVersion: v1
data:
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/mtstrong/
  custom.css: ""
  custom.js: ""
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
  services.yaml: |
    - Proxmox:
        - x1a:
            icon: proxmox.svg
            href: https://192.168.1.87:8006
            widget:
              type: proxmox
              url: https://192.168.1.87:8006
              username: api@pam!homepage
              password: {{HOMEPAGE_VAR_PROXMOX_PASSWORD}}
              node: x1a
        - x1b:
            icon: proxmox.svg
            href: https://192.168.1.62:8006
            widget:
              type: proxmox
              url: https://192.168.1.62:8006
              username: api@pam!homepage
              password: {{HOMEPAGE_VAR_PROXMOX_PASSWORD}}
              node: x1b
        - x1c:
            icon: proxmox.svg
            href: https://192.168.1.25:8006
            widget:
              type: proxmox
              url: https://192.168.1.25:8006
              username: api@pam!homepage
              password: {{HOMEPAGE_VAR_PROXMOX_PASSWORD}}
              node: x1c
        - um773a:
            icon: proxmox.svg
            href: https://192.168.1.109:8006
            description: Spare
            widget:
              type: proxmox
              url: https://192.168.1.109:8006
              username: api@pam!homepage
              password: {{HOMEPAGE_VAR_PROXMOX_PASSWORD}}
              node: um773a

    - Storage:
        - TrueNAS:
            icon: truenas.png
            href: https://192.168.1.70
            description: NAS
            widget:
              type: truenas
              url: https://192.168.1.70
              key: {{HOMEPAGE_VAR_TRUENAS_KEY}}
        - Proxmox Backup Server:
            icon: proxmox.svg
            href: https://192.168.1.117:8007
            description: VM backups
            widget:
              type: proxmoxbackupserver
              url: https://192.168.1.117:8007
              username: root@pam!api
              password: {{HOMEPAGE_VAR_PROXMOX_BACKUP_PASSWORD}}
              datastore: truenas

    - Networking:
        - pfSense:
            icon: pfsense.png
            href: https://192.168.1.1
            description: Firewall & Router
            siteMonitor: https://192.168.1.1
            widget:
              type: pfsense
              url: https://192.168.1.1
              fields: ["load", "memory", "wanStatus", "disk"]
              username: admin
              headers:
                X-API-Key: {{HOMEPAGE_VAR_PFSENSE_API_KEY}}
              wan: igc0
              version: 2
        - Traefik:
            icon: traefik.png
            href: https://traefik.tehmatt.com
            description: Reverse Proxy
            widget:
              type: traefik
              url: https://traefik.tehmatt.com
              username: matt
              password: {{HOMEPAGE_VAR_COMMON_PASSWORD}}
        - Headscale:
            icon: headscale.png
            href: https://headscale.tehmatt.com
            description: Tailnet Control Server

    - Platform:
        - ArgoCD:
            icon: argo-cd.png
            href: https://argocd.tehmatt.com
            description: GitOps CD
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local:80
              key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
        - Authentik:
            icon: authentik.png
            href: https://auth.tehmatt.com
            description: SSO
        - IT-Tools:
            icon: it-tools.png
            href: https://tools.tehmatt.com
            description: Developer Utilities

    - Media:
        - Plex:
            icon: plex.png
            href: https://app.plex.tv/desktop
            description: Media Server
            widget:
              type: plex
              url: http://192.168.1.70:32400
              key: {{HOMEPAGE_VAR_PLEX_KEY}}
        - Overseerr:
            icon: overseerr.png
            href: https://request.tehmatt.com
            description: Requests
            widget:
              type: overseerr
              url: http://overseerr.overseerr.svc.cluster.local:5055
              key: {{HOMEPAGE_VAR_OVERSEERR_KEY}}
        - Audiobookshelf:
            icon: audiobookshelf.png
            href: https://abs.tehmatt.com
            description: Audiobook Server
            widget:
              type: audiobookshelf
              url: http://audiobookshelf.audiobookshelf.svc.cluster.local:80
              key: {{HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY}}
        - Kavita:
            icon: kavita.png
            href: https://kavita.tehmatt.com
            description: Comic Server
            widget:
              type: kavita
              url: http://kavita.kavita.svc.cluster.local:5000
              username: matt
              password: {{HOMEPAGE_VAR_COMMON_PASSWORD}}
        - Calibre-Web:
            icon: calibre.png
            href: https://calibre.tehmatt.com
            description: eBook Server
        - RomM:
            icon: romm.png
            href: https://romm.tehmatt.com
            description: ROM Library

    - Media Management:
        - Sonarr:
            icon: sonarr.png
            href: https://sonarr.tehmatt.com
            description: TV Shows
            widget:
              type: sonarr
              url: http://sonarr.sonarr.svc.cluster.local:8989
              key: {{HOMEPAGE_VAR_SONARR_KEY}}
        - Radarr:
            icon: radarr.png
            href: https://radarr.tehmatt.com
            description: Movies
            widget:
              type: radarr
              url: http://radarr.radarr.svc.cluster.local:7878
              key: {{HOMEPAGE_VAR_RADARR_KEY}}
        - Prowlarr:
            icon: prowlarr.png
            href: https://prowlarr.tehmatt.com
            description: Indexers
            widget:
              type: prowlarr
              url: http://prowlarr.prowlarr.svc.cluster.local:9696
              key: {{HOMEPAGE_VAR_PROWLARR_KEY}}
        - Bazarr:
            icon: bazarr.png
            href: https://bazarr.tehmatt.com
            description: Subtitles
            widget:
              type: bazarr
              url: http://bazarr.bazarr.svc.cluster.local:6767
              key: {{HOMEPAGE_VAR_BAZARR_KEY}}
        - Mylar3:
            icon: mylar.png
            href: https://mylar.tehmatt.com
            description: Comics
            # Re-add the mylar widget once the library has series: with zero series
            # its series endpoint returns an error (code 460) and the tile shows it.
        - Readarr:
            icon: readarr.png
            href: http://192.168.2.127:8787
            description: Books
            widget:
              type: readarr
              url: http://readarr.readarr.svc.cluster.local:8787
              key: {{HOMEPAGE_VAR_READARR_KEY}}

    - Downloads:
        - SABnzbd:
            icon: sabnzbd.png
            href: https://sab.tehmatt.com
            description: Usenet Downloader
            widget:
              type: sabnzbd
              url: http://sabnzbd.sabnzbd.svc.cluster.local:8080
              key: {{HOMEPAGE_VAR_SABNZBD_KEY}}
        - HandBrake:
            icon: handbrake.png
            href: https://handbrake.tehmatt.com
            description: Video Transcoding

    - Home:
        - Home Assistant:
            icon: home-assistant.png
            href: http://192.168.1.68:8123
            description: Home Automation
            widget:
              type: homeassistant
              url: http://192.168.1.68:8123
              key: {{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}
        - Homebridge:
            icon: homebridge.png
            href: http://192.168.2.130:8581
            description: HomeKit Bridge
            widget:
              type: homebridge
              url: http://homebridge.homebridge.svc.cluster.local:8581
              username: matt
              password: {{HOMEPAGE_VAR_COMMON_PASSWORD}}
        - Mealie:
            icon: mealie.png
            href: https://mealie.tehmatt.com
            description: Recipes

    - Monitoring:
        - Grafana:
            icon: grafana.png
            href: https://grafana.tehmatt.com
            description: Dashboards
            widget:
              type: grafana
              url: http://grafana.grafana.svc.cluster.local:3000
              username: admin
              password: {{HOMEPAGE_VAR_GRAFANA_PASSWORD}}
        - Prometheus:
            icon: prometheus.png
            href: https://prometheus.tehmatt.com
            description: Metrics
            widget:
              type: prometheus
              url: http://prometheus.prometheus.svc.cluster.local:9090
        - Loki:
            icon: loki.png
            href: https://grafana.tehmatt.com/explore
            description: Logs
            siteMonitor: http://loki.loki-stack.svc.cluster.local:3100/ready
        - Tautulli:
            icon: tautulli.png
            href: https://tautulli.tehmatt.com
            description: Plex Monitoring
            widget:
              type: tautulli
              url: http://tautulli.tautulli.svc.cluster.local:8181
              key: {{HOMEPAGE_VAR_TAUTULLI_KEY}}
        - Azure FinOps:
            icon: microsoft-azure.png
            href: https://grafana.tehmatt.com/d/azure-finops-dashboard
            description: Azure Costs
            widget:
              type: customapi
              url: http://azure-finops-exporter.azure-finops.svc.cluster.local:8080/api/summary
              mappings:
                - field: mtd_cost_usd
                  label: MTD Cost
                  format: currency
                - field: budget_utilisation_pct
                  label: Budget Used
                  format: percent
                - field: projected_monthly_usd
                  label: Projected
                  format: currency
  settings.yaml: |
    title: Matt Strong's Homepage

    useEqualHeights: true

    layout:
      Proxmox:
        style: row
        columns: 4
      Storage:
        style: row
        columns: 2
      Networking:
        style: row
        columns: 3
      Platform:
        style: row
        columns: 3
      Media:
        style: row
        columns: 3
      Media Management:
        style: row
        columns: 3
      Downloads:
        style: row
        columns: 2
      Home:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 5
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
kind: ConfigMap
metadata:
  labels:
    app: homepage
  name: homepage
  namespace: homepage
