---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: recyclarr
spec:
  schedule: "15 5 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            worker: "true"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          containers:
          - name: recyclarr
            image: ghcr.io/recyclarr/recyclarr:8.8.0
            command: ["recyclarr", "sync"]
            env:
            - name: TZ
              value: America/Chicago
            - name: RECYCLARR_CONFIG_DIR
              value: /config
            envFrom:
            - secretRef:
                name: recyclarr-secrets
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: config
              mountPath: /config
            - name: recyclarr-yml
              mountPath: /config/recyclarr.yml
              subPath: recyclarr.yml
              readOnly: true
          volumes:
          # Recyclarr caches the TRaSH repo and its sync state under /config; a fresh copy each run is fine.
          - name: config
            emptyDir: {}
          - name: recyclarr-yml
            configMap:
              name: recyclarr-config
