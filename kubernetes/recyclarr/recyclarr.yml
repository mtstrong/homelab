# Recyclarr (https://recyclarr.dev) syncs TRaSH Guides custom formats and their scores into Sonarr and Radarr.
# Replaced Notifiarr's TRaSH sync on 2026-10-26; scores were generated from the live values at that time.
# 2026-10-26: HD-1080p made "1080p Bluray first" in both apps (TRaSH HD Bluray + WEB style): HD Bluray tiers
# score above WEB tiers, upgrades on until Bluray-1080p, Radarr remuxes no longer grabbed (existing ones kept).
# Recyclarr manages custom formats, their scores, and the HD-1080p profiles below; the other profiles' qualities
# and the quality sizes are left as configured in the apps. Edit here, not in the UI (the next sync reverts UI edits).
# Run on demand: kubectl -n recyclarr create job --from=cronjob/recyclarr recyclarr-manual

sonarr:
  sonarr:
    base_url: http://sonarr.sonarr.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY
    quality_profiles:
      - name: HD-1080p
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-2160p Remux
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: WEB 2160p
            enabled: false
            qualities: [WEBRip-2160p, WEBDL-2160p]
          - name: HDTV-2160p
            enabled: false
          - name: Bluray-1080p Remux
            enabled: false
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBRip-1080p, WEBDL-1080p]
          - name: HDTV-1080p
          - name: Bluray-720p
            enabled: false
          - name: WEB 720p
            enabled: false
            qualities: [WEBRip-720p, WEBDL-720p]
          - name: Raw-HD
            enabled: false
          - name: HDTV-720p
            enabled: false
          - name: Bluray-576p
            enabled: false
          - name: Bluray-480p
            enabled: false
          - name: DVD
            enabled: false
          - name: WEB 480p
            enabled: false
            qualities: [WEBRip-480p, WEBDL-480p]
          - name: SDTV
            enabled: false
          - name: Unknown
            enabled: false
