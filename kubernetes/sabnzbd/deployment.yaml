---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sabnzbd
  name: sabnzbd
  namespace: sabnzbd
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      nodeSelector:
        worker: "true"
      tolerations:
      # Evict quickly if the node dies so Longhorn can reattach volumes elsewhere
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: sabnzbd
        image: lscr.io/linuxserver/sabnzbd:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Chicago"
        - name: SABNZBD_HOST_WHITELIST
          value: "sab.tehmatt.com"
        ports:
        - containerPort: 8585
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: 8585
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8585
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
        # Overlays the NFS intermediate/ so par2/unpack I/O stays on the
        # node's local NVMe; only finished files cross NFS to completed/
        - name: scratch
          mountPath: /downloads/intermediate
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sabnzbd-config
      - name: downloads
        nfs:
          server: 192.168.1.70
          path: /mnt/OneTbs/nzb-dls
      # 300G scsi1 disk on each worker VM, mounted at /mnt/scratch (fstab, nofail).
      # Type Directory, not DirectoryOrCreate: if the disk didn't mount, the
      # subdir is missing and the pod waits instead of filling the root disk.
      # Not pinned to a node: in-flight downloads are lost on failover and get
      # re-grabbed by Radarr/Sonarr.
      - name: scratch
        hostPath:
          path: /mnt/scratch/sabnzbd
          type: Directory
