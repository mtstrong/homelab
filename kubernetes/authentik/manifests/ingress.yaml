---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`auth.tehmatt.com`)
    kind: Rule
    services:
    - name: authentik-server
      port: 80
  tls: {}
---
# Forward-auth middleware for other apps' IngressRoutes (reference it with name: authentik, namespace: authentik).
# Each protected host needs a Proxy Provider (forward auth, single application) in Authentik, bound to the
# embedded outpost, plus a route for Host(...) && PathPrefix(`/outpost.goauthentik.io/`) to authentik-server
# (see kubernetes/sabnzbd/ingress.yaml). The embedded outpost runs inside authentik-server; there is no
# separate outpost Service.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
    - X-authentik-username
    - X-authentik-groups
    - X-authentik-email
    - X-authentik-name
    - X-authentik-uid
