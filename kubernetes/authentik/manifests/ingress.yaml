---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`auth.tehmatt.com`)
    kind: Rule
    services:
    - name: authentik-server
      port: 80
  tls: {}
---
# Forward-auth middleware for other apps' IngressRoutes. Reference it cross-namespace as
# `authentik-authentik@kubernetescrd`, or by name/namespace in the route's middlewares list.
# Each protected host needs a Proxy Provider (forward auth, single application) in Authentik,
# bound to the embedded outpost.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: authentik
spec:
  forwardAuth:
    address: http://ak-outpost-authentik-embedded-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
    - X-authentik-username
    - X-authentik-groups
    - X-authentik-email
    - X-authentik-name
    - X-authentik-uid
