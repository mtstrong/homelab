# k3s upgrade Plans for system-upgrade-controller. Changing `version` in all three Plans starts
# an upgrade: control-plane nodes first, then the workers, then the Longhorn storage nodes, one
# node at a time. Upgrade one minor version at a time (see the k3s upgrade plan: 1.26 -> 1.36).
#
# Workers are cordoned but not drained, so pods keep running while k3s restarts under them.
# For a risky upgrade (the containerd 2 switch in 1.31) add a drain block to agent-plan
# (force, ignoreDaemonSets, deleteEmptydirData) so apps move off each worker first.
# Storage nodes are only cordoned:
# draining them would evict Longhorn's instance managers and force replica rebuilds.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: In
      values: ["true"]
  tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: CriticalAddonsOnly
    operator: Exists
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
  version: v1.35.9+k3s1
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
    - key: worker
      operator: In
      values: ["true"]
  prepare:
    # Wait until every control-plane node is on the new version
    image: rancher/k3s-upgrade
    args: ["prepare", "server-plan"]
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
  version: v1.35.9+k3s1
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: storage-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: DoesNotExist
    - key: worker
      operator: DoesNotExist
  prepare:
    # Wait until every worker is on the new version
    image: rancher/k3s-upgrade
    args: ["prepare", "agent-plan"]
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
  version: v1.35.9+k3s1
