# Decluttarr clears stuck items out of the Radarr/Sonarr queues so failed downloads get
# blocklisted and retried, and periodically re-searches missing items. Behaviour is set
# in configmap.yaml.
#
# API keys live in the arr-api-keys Secret, created out of band:
#   kubectl -n decluttarr create secret generic arr-api-keys \
#     --from-literal=radarr=<key> --from-literal=sonarr=<key>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decluttarr
  namespace: decluttarr
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: decluttarr
  template:
    metadata:
      labels:
        app: decluttarr
      annotations:
        # Restart when the config changes (bump when editing configmap.yaml)
        config-version: "2"
    spec:
      nodeSelector:
        worker: "true"
      containers:
      - name: decluttarr
        image: ghcr.io/manimatter/decluttarr:v2.2.0
        env:
        - name: TZ
          value: America/Chicago
        - name: RADARR_API_KEY
          valueFrom:
            secretKeyRef:
              name: arr-api-keys
              key: radarr
        - name: SONARR_API_KEY
          valueFrom:
            secretKeyRef:
              name: arr-api-keys
              key: sonarr
        volumeMounts:
        - name: config
          mountPath: /app/config/config.yaml
          subPath: config.yaml
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
            cpu: "250m"
      volumes:
      - name: config
        configMap:
          name: decluttarr-config
