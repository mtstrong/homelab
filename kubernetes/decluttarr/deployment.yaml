# Decluttarr (https://github.com/ManiMatter/decluttarr) clears stuck items out of the
# Radarr/Sonarr queues so failed downloads get blocklisted and retried automatically.
#
# Deliberately conservative:
# - Failed imports are only removed when the message says the download is redundant
#   (not an upgrade, nothing left to import). Items that need a human, like
#   "matched to series by ID" or episode-number mismatches, are left alone and
#   surface through the ArrQueueStuck alert instead.
# - Orphans (SABnzbd jobs Radarr/Sonarr don't track) are kept, because they can
#   still be imported by hand.
# - Stalled/slow/metadata checks are torrent-only; this setup is usenet-only.
#
# API keys live in the arr-api-keys Secret, created out of band:
#   kubectl -n decluttarr create secret generic arr-api-keys \
#     --from-literal=radarr=<key> --from-literal=sonarr=<key>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decluttarr
  namespace: decluttarr
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: decluttarr
  template:
    metadata:
      labels:
        app: decluttarr
    spec:
      nodeSelector:
        worker: "true"
      containers:
      - name: decluttarr
        image: ghcr.io/manimatter/decluttarr:v1.50.2
        env:
        - name: TZ
          value: America/Chicago
        - name: LOG_LEVEL
          value: INFO
        - name: TEST_RUN
          value: "False"
        - name: REMOVE_TIMER
          value: "10"
        - name: PERMITTED_ATTEMPTS
          value: "3"
        - name: REMOVE_FAILED
          value: "True"
        - name: REMOVE_FAILED_IMPORTS
          value: "True"
        - name: FAILED_IMPORT_MESSAGE_PATTERNS
          value: '["Not a Custom Format upgrade for existing", "Not an upgrade for existing", "Not a quality revision upgrade", "No files found are eligible for import"]'
        - name: REMOVE_MISSING_FILES
          value: "True"
        - name: REMOVE_ORPHANS
          value: "False"
        - name: REMOVE_UNMONITORED
          value: "False"
        - name: REMOVE_STALLED
          value: "False"
        - name: REMOVE_SLOW
          value: "False"
        - name: REMOVE_METADATA_MISSING
          value: "False"
        # Re-search missing items weekly, a few at a time, so failures that slipped
        # through (e.g. SABnzbd jobs the apps lost track of) still get retried.
        - name: RUN_PERIODIC_RESCANS
          value: '{"SONARR": {"MISSING": true, "CUTOFF_UNMET": false, "MAX_CONCURRENT_SCANS": 3, "MIN_DAYS_BEFORE_RESCAN": 7}, "RADARR": {"MISSING": true, "CUTOFF_UNMET": false, "MAX_CONCURRENT_SCANS": 3, "MIN_DAYS_BEFORE_RESCAN": 7}}'
        - name: RADARR_URL
          value: http://radarr.radarr.svc.cluster.local:7878
        - name: RADARR_KEY
          valueFrom:
            secretKeyRef:
              name: arr-api-keys
              key: radarr
        - name: SONARR_URL
          value: http://sonarr.sonarr.svc.cluster.local:8989
        - name: SONARR_KEY
          valueFrom:
            secretKeyRef:
              name: arr-api-keys
              key: sonarr
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
            cpu: "250m"
