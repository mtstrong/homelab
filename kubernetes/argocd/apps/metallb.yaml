apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/name: metallb
spec:
  project: default
  source:
    repoURL: https://github.com/mtstrong/homelab.git
    path: kubernetes/metallb
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  # The MetalLB controller generates its webhook certificate and injects the CA itself;
  # without these, self-heal would keep resetting them to the empty values in the manifest.
  ignoreDifferences:
  - kind: Secret
    name: metallb-webhook-cert
    namespace: metallb-system
    jsonPointers: [/data]
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    name: metallb-webhook-configuration
    jqPathExpressions: [.webhooks[]?.clientConfig.caBundle]
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    jqPathExpressions: [.spec.conversion.webhook.clientConfig.caBundle]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: {duration: 20s, factor: 2, maxDuration: 5m}
