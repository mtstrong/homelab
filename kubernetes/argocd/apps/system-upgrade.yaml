apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
    app.kubernetes.io/name: system-upgrade
spec:
  project: default
  source:
    repoURL: https://github.com/mtstrong/homelab.git
    path: kubernetes/system-upgrade
    targetRevision: HEAD
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: system-upgrade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # The Plan CRD is too large for client-side apply's last-applied annotation
    - ServerSideApply=true
