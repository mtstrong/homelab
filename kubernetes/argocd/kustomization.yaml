apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# Pin to a specific Argo CD version
resources:
- https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.1/manifests/install.yaml
- avp-plugin.yaml
- ingress.yaml
- apps/audiobookshelf.yaml
- apps/cadvisor.yaml
- apps/calibre.yaml
- apps/dozzle.yaml
- apps/falco.yaml
- apps/grafana.yaml
- apps/handbrake.yaml
- apps/homebridge.yaml
- apps/homepage.yaml
- apps/it-tools.yaml
- apps/kavita.yaml
- apps/loki.yaml
- apps/tinyauth.yaml
- apps/mealie.yaml
- apps/node-exporter.yaml
- apps/notifiarr.yaml
- apps/overseerr.yaml
- apps/plex-exporter.yaml
- apps/prometheus.yaml
- apps/prowlarr.yaml
- apps/radarr.yaml
- apps/readarr.yaml
- apps/romm.yaml
- apps/sabnzbd.yaml
- apps/sonarr.yaml
- apps/tautulli.yaml
- apps/velero.yaml
- apps/vaultwarden.yaml
- apps/headscale.yaml

patchesStrategicMerge:
- patch-repo-server-avp.yaml

patches:
- target:
    kind: Deployment
    name: argocd-server
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args
      value: ["argocd-server", "--insecure"]
- target:
    kind: Service
    name: argocd-server
  patch: |-
    - op: replace
      path: /spec/type
      value: LoadBalancer
